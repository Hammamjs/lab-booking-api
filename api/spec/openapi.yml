openapi: 3.0.3
info:
  title: Core P0 API Specification
  description: Minimal OpenAPI v3 spec covering core authentication, resources, bookings, attendance, and device endpoints for frontend and mobile apps.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Local development server

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: StrongP@ss123
                name:
                  type: string
                  example: John Doe
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      summary: Authenticate user and issue tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: StrongP@ss123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      summary: Refresh access token using a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /resources:
    get:
      summary: List all available resources
      responses:
        '200':
          description: A list of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'

  /resources/{id}/availability:
    get:
      summary: Get resource availability by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: res_12345
      responses:
        '200':
          description: Availability slots for the resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceId:
                    type: string
                    example: res_12345
                  availableSlots:
                    type: array
                    items:
                      type: object
                      properties:
                        startTime:
                          type: string
                          format: date-time
                          example: '2026-10-20T09:00:00Z'
                        endTime:
                          type: string
                          format: date-time
                          example: '2026-10-20T10:00:00Z'

  /bookings:
    post:
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceId
                - startTime
                - endTime
              properties:
                resourceId:
                  type: string
                  example: res_12345
                startTime:
                  type: string
                  format: date-time
                  example: '2026-10-20T09:00:00Z'
                endTime:
                  type: string
                  format: date-time
                  example: '2026-10-20T10:00:00Z'
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /bookings/me:
    get:
      summary: Get bookings for the authenticated user
      responses:
        '200':
          description: List of user bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /bookings/{id}:
    delete:
      summary: Cancel/Delete a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: book_98765
      responses:
        '204':
          description: Booking successfully deleted

  /attendance/sessions:
    post:
      summary: Create an attendance session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - title
              properties:
                courseId:
                  type: string
                  example: course_xyz
                title:
                  type: string
                  example: Lecture 1 - Intro to Architecture
      responses:
        '201':
          description: Attendance session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'

  /attendance/sessions/{id}/qr:
    get:
      summary: Get dynamic QR code data for an attendance session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: sess_111
      responses:
        '200':
          description: QR code payload retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: string
                    example: sess_111
                  qrPayload:
                    type: string
                    example: token_payload_string_for_qr
                  expiresAt:
                    type: string
                    format: date-time
                    example: '2026-10-16T11:05:00Z'

  /attendance/scan:
    post:
      summary: Scan/Submit attendance QR code from mobile client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qrPayload
                - deviceId
              properties:
                qrPayload:
                  type: string
                  example: token_payload_string_for_qr
                deviceId:
                  type: string
                  example: dev_abc123
      responses:
        '200':
          description: Attendance successfully recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  recordedAt:
                    type: string
                    format: date-time
                    example: '2026-10-16T10:55:00Z'

  /devices:
    post:
      summary: Register mobile or client device for push notifications/attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - platform
              properties:
                token:
                  type: string
                  example: fcm_device_token_string_here
                platform:
                  type: string
                  enum: [ios, android, web]
                  example: ios
      responses:
        '201':
          description: Device registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /users/me:
    get:
      summary: Get profile details of the authenticated user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use access token in Authorization header as `Bearer <JWT>`

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: usr_12345
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: John Doe
        createdAt:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00Z'

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: dGhpc2lzYXJlZnJlc2h0b2tlbmV4YW1wbGU...
        user:
          $ref: '#/components/schemas/User'

    Resource:
      type: object
      properties:
        id:
          type: string
          example: res_12345
        name:
          type: string
          example: Conference Room A
        type:
          type: string
          example: room
        capacity:
          type: integer
          example: 10

    Booking:
      type: object
      properties:
        id:
          type: string
          example: book_98765
        userId:
          type: string
          example: usr_12345
        resourceId:
          type: string
          example: res_12345
        startTime:
          type: string
          format: date-time
          example: '2026-10-20T09:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2026-10-20T10:00:00Z'

    AttendanceSession:
      type: object
      properties:
        id:
          type: string
          example: sess_111
        courseId:
          type: string
          example: course_xyz
        title:
          type: string
          example: Lecture 1 - Intro to Architecture
        createdAt:
          type: string
          format: date-time
          example: '2026-10-16T10:00:00Z'

    Device:
      type: object
      properties:
        id:
          type: string
          example: dev_abc123
        userId:
          type: string
          example: usr_12345
        token:
          type: string
          example: fcm_device_token_string_here
        platform:
          type: string
          example: ios
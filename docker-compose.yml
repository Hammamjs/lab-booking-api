services:
  lab-booking:
    container_name: booking
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "booking"
      POSTGRES_PASSWORD: password
    ports: 
    - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
   postgres_data: